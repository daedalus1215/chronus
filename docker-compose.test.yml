# Test database for `npm run test:integration` (see backend/AGENTS.md).
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down   # drop data when done
#
# Mirrors the prod Postgres major version (home-lab infra: postgres:16-alpine).
# Port 5433 so it cannot collide with a local 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronus_test
      POSTGRES_USER: chronus
      POSTGRES_PASSWORD: chronus_test
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronus -d chronus_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  test-db-data:
