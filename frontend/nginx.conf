server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA fallback: a hard refresh on a client route must serve index.html, not 404.
    try_files $uri $uri/ /index.html;
  }

  # NOTE: deliberately no /api proxy here. Traefik splits /api off to the backend
  # before traffic reaches this container — including the WebSocket upgrade for
  # /api/notes/transcribe-audio, which is why the backend router owns the whole
  # /api prefix rather than just the REST routes.
}
