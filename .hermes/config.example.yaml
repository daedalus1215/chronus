# Notes:
#
# 1. Context budget (approximate):
#    - Hermes internal system prompt:   ~4,000 tokens
#    - AGENTS.md (root, trimmed):       ~2,500 tokens
#    - Subdirectory hint (when active): ~1,000 tokens
#    - Skill body (when loaded):        ~1,500 tokens
#    - Available for conversation:     ~111,000 tokens
#
# 2. The project has local reference docs in docs/references/ that the agent
#    can read_file on demand. This is more reliable than MCP for self-hosted setups:
#    - docs/references/nestjs-decorators.md
#    - docs/references/typeorm-patterns.md
#    - docs/references/mui-components.md
#
# 3. Hermes auto-discovers AGENTS.md at the project root. Subdirectory hints
#    load progressively from backend/AGENTS.md and frontend/AGENTS.md when
#    the agent touches files in those directories.
